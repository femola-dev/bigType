<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilt Test</title>
  <style>
    body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
    #iframe-container { width: 100%; height: 80vh; border: 2px solid #ccc; position: relative; }
    iframe { width: 100%; height: 100%; border: none; }
    #controls { margin-bottom: 20px; }
    button { margin: 5px; padding: 10px 20px; cursor: pointer; }
    #log { margin-top: 20px; padding: 10px; background: #f5f5f5; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="controls">
    <h2>3D Tilt Test</h2>
    <button onclick="testTopRight()">Test Top-Right</button>
    <button onclick="testBottomLeft()">Test Bottom-Left</button>
    <button onclick="testMouseLeave()">Test Mouse Leave</button>
    <button onclick="testCenter()">Test Center</button>
  </div>
  
  <div id="iframe-container">
    <iframe id="main-frame" src="/"></iframe>
  </div>
  
  <div id="log"></div>

  <script>
    const iframe = document.getElementById('main-frame');
    const log = document.getElementById('log');
    
    function addLog(message) {
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }
    
    function simulateMouseMove(x, y) {
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        const target = iframeDoc.elementFromPoint(x, y);
        
        if (target) {
          const event = new MouseEvent('mousemove', {
            view: iframe.contentWindow,
            bubbles: true,
            cancelable: true,
            clientX: x,
            clientY: y
          });
          target.dispatchEvent(event);
          addLog(`Mouse moved to (${x}, ${y}) on element: ${target.className || target.tagName}`);
        } else {
          addLog(`No element found at (${x}, ${y})`);
        }
      } catch (e) {
        addLog(`Error: ${e.message}`);
      }
    }
    
    function getImageBounds() {
      try {
        const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
        const img = iframeDoc.querySelector('[class*="mainImage"]');
        if (img) {
          const rect = img.getBoundingClientRect();
          addLog(`Image bounds: left=${rect.left.toFixed(0)}, top=${rect.top.toFixed(0)}, right=${rect.right.toFixed(0)}, bottom=${rect.bottom.toFixed(0)}`);
          return rect;
        } else {
          addLog('Image element not found');
          return null;
        }
      } catch (e) {
        addLog(`Error getting bounds: ${e.message}`);
        return null;
      }
    }
    
    function testTopRight() {
      const rect = getImageBounds();
      if (rect) {
        const x = rect.right - 100;
        const y = rect.top + 100;
        simulateMouseMove(x, y);
      }
    }
    
    function testBottomLeft() {
      const rect = getImageBounds();
      if (rect) {
        const x = rect.left + 100;
        const y = rect.bottom - 100;
        simulateMouseMove(x, y);
      }
    }
    
    function testCenter() {
      const rect = getImageBounds();
      if (rect) {
        const x = (rect.left + rect.right) / 2;
        const y = (rect.top + rect.bottom) / 2;
        simulateMouseMove(x, y);
      }
    }
    
    function testMouseLeave() {
      simulateMouseMove(100, 100);
      addLog('Mouse moved away from image');
    }
    
    // Wait for iframe to load
    iframe.addEventListener('load', () => {
      addLog('Iframe loaded');
      setTimeout(() => {
        addLog('Waiting for hero page to appear...');
        setTimeout(() => {
          getImageBounds();
        }, 4000);
      }, 500);
    });
  </script>
</body>
</html>
